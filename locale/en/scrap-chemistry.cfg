[mod-setting-name]
scrap-chemistry-recipe-mode=Recipes
scrap-chemistry-sulfur=[item=sulfur] Modify sulfur
scrap-chemistry-rocket-fuel=[item=rocket-fuel] Modify rocket fuel
scrap-chemistry-thruster=[item=thruster] Modify thruster fuel
