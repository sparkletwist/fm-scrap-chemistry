[mod-setting-description]
scrap-chemistry-recipe-mode=Whether to use the standard Scrappy Chemistry recipes or S6X's modified recipes.
scrap-chemistry-sulfur=Change [item=sulfur] Sulfur to require [fluid=sour-gas] Sour gas to produce, and change oil cracking recipes to yield sour gas as a byproduct. This setting is ignored (always on) in Remix mode.
scrap-chemistry-rocket-fuel=Add [fluid=methane] Methane to the recipe for [item=rocket-fuel] Rocket fuel, and make it a chemistry recipe crafted in the [item=chemical-plant] Chemical plant.
scrap-chemistry-thruster=Change [fluid=thruster-fuel] Thruster fuel to require [fluid=methane] Methane to produce. This setting is ignored (always off) in Remix mode.
scrap-chemistry-butane-realism=Change [fluid=butane] Butane to be cracked into Petroleum gas, instead of the other way around. Recommended on as it doesn't change much, but it remains optional for legacy reasons. This setting is ignored (always on) in Remix mode.
scrap-chemistry-casting-tar=Add [item=tar] Tar as a byproduct from using molten metals in casting recipes.
scrap-chemistry-asphalt-compat=Change the recipe for [item=Arci-asphalt] Asphalt to use [item=tar] Tar instead of oils, and much more stone.

[string-mod-setting]
scrap-chemistry-asphalt-compat-replace=Replace
scrap-chemistry-asphalt-compat-alternative=Alt recipe
scrap-chemistry-asphalt-compat-none=None
scrap-chemistry-recipe-mode-standard=Standard
scrap-chemistry-recipe-mode-remix=Remix

[string-mod-setting-description]
scrap-chemistry-asphalt-compat-replace=Modify the existing recipe with the new ingredients and change it to be a regular [item=assembling-machine-2] crafting recipe.
scrap-chemistry-asphalt-compat-alternative=Add a second recipe with the new ingredients, leaving the original recipe intact.
scrap-chemistry-asphalt-compat-none=Do nothing.
